name: CI Machine Learning Pipeline & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Repozitoriyani yuklash (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.11 ni o'rnatish
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install scikit-learn pandas kagglehub joblib

    - name: Unit testlarni ishga tushirish
      run: |
        python test_suite.py

    - name: Bashorat pipeline'ini tekshirish
      run: |
        python predict.py --model "galaxy a15"
